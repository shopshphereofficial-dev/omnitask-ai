name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK that ships with the runner, and top it up with the
      # exact platform and build-tools this project needs. This step is written
      # so it can never fail the job - Gradle picks up the SDK via ANDROID_SDK_ROOT.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "Android SDK ready at $SDK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # Keep one debug signing key across builds so a new APK installs over the
      # previous one instead of asking the user to uninstall first.
      - name: Restore debug signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omnitask-debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OmniTask-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTask-AI-debug-apk
          path: OmniTask-AI.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5
          name: OmniTask AI v4.5
          body: |
            Download **OmniTask-AI.apk** below and install it on your phone.

            New in v4.5 - fixes the Gemini "thought_signature" error:
            - Gemini 3 tool calls are now echoed back exactly as received, so the HTTP 400 error is gone
            - The no-tools fallback cleans up the conversation first, so it no longer fails either
            - Everything from v4.4: real tool calling, wait_for_build, repeat guard, stop button, neon theme
          files: OmniTask-AI.apk
          make_latest: true
