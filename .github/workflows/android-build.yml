name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK that ships with the runner, and top it up with the
      # exact platform and build-tools this project needs. This step is written
      # so it can never fail the job - Gradle picks up the SDK via ANDROID_SDK_ROOT.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "Android SDK ready at $SDK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OmniTask-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTask-AI-debug-apk
          path: OmniTask-AI.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0
          name: OmniTask AI v4.0
          body: |
            Download **OmniTask-AI.apk** below and install it on your phone.

            New in v4.0:
            - GitHub integration - create repositories, push files and start builds from the chat
            - Switch the AI provider/model right from the chat header
            - Up-to-date model list (Gemini 3.8 Flash, GPT-5.6, DeepSeek and more)
            - API keys and the GitHub token are now stored encrypted
            - The build workflow itself is fixed, so every push produces a fresh APK
          files: OmniTask-AI.apk
          make_latest: true
